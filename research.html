<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="preload" href="config/fund.json" as="fetch" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<title>Research</title>
</head>
<body>
<main>
  <div class="page-head wrap">
    <h1>Research</h1>
    <p>The case for each company we own, and the macro backdrop we are investing in.</p>
  </div>
  <section class="block wrap" aria-labelledby="fund-title">
    <div class="block-head"><div><h2 id="fund-title">Company research</h2><p>Thesis, valuation and target price. Upside is recalculated from the latest price.</p></div></div>
    <div id="fundamental"></div>
  </section>
  <section class="block wrap" aria-labelledby="macro-title">
    <div class="block-head"><h2 id="macro-title">Macro and news</h2></div>
    <div class="regime" id="regime" hidden></div>
    <div class="cols-2">
      <div id="macro"></div>
      <div>
        <h3 style="margin-bottom:14px">Calendar</h3>
        <div class="table-scroll">
          <table class="data" id="calendar">
            <thead><tr><th class="l">Date</th><th class="l">Event</th><th class="l">Why it matters to us</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>
<script defer src="assets/js/app.js"></script>
<script defer src="assets/js/research.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2311264A%27/%3E%3Crect x=%277%27 y=%277%27 width=%2718%27 height=%2718%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272%27/%3E%3C/svg%3E">
<title>Research</title>
</head>
<body>
<main>
  <div class="page-head wrap">
    <h1>Research</h1>
    <p>The case for each company we own, and the macro backdrop we are investing in.</p>
  </div>
  <section class="block wrap" aria-labelledby="fund-title">
    <div class="block-head"><div><h2 id="fund-title">Company research</h2><p>Thesis, valuation and target price. Upside is recalculated from the latest price.</p></div></div>
    <div id="fundamental"></div>
  </section>
  <section class="block wrap" aria-labelledby="macro-title">
    <div class="block-head"><h2 id="macro-title">Macro and news</h2></div>
    <div class="regime" id="regime" hidden></div>
    <div class="cols-2">
      <div id="macro"></div>
      <div>
        <h3 style="margin-bottom:14px">Calendar</h3>
        <div class="table-scroll">
          <table class="data" id="calendar">
            <thead><tr><th class="l">Date</th><th class="l">Event</th><th class="l">Why it matters to us</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/research.js"></script>
</body>
</html>

name: Load stock prices

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Load full history from this date (leave empty to refresh only the latest days)"
        required: false
        default: ""
  schedule:
    - cron: "40 23 * * 5"   # every Friday night: add the week's new prices

permissions:
  contents: read

concurrency:
  group: load-stock-prices
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-loader.txt
      - run: pip install -r requirements-loader.txt
      - name: Load prices into the private database
        env:
          SUPABASE_URL: https://djrmmlsfqwowkcdxghwp.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "The SUPABASE_SECRET_KEY secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -n "$SINCE" ]; then
            python scripts/load_prices.py --since "$SINCE"
          else
            python scripts/load_prices.py --days 15
          fi

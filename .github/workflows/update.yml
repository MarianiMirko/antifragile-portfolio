name: Update fund data

on:
  schedule:
    # Times are UTC. US market hours are 14:30-21:00 UTC in winter (15:30-22:00 in Italy / the Netherlands).
    - cron: "35 14-20 * * 1-5"   # every hour while the market is open
    - cron: "15 21 * * 1-5"      # once after the close
  workflow_dispatch:              # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "content/**"
      - "config/**"
      - "models/**"
      - "scripts/**"
      - "data/holdings.json"
      - "data/transactions.json"

permissions:
  contents: write

concurrency:
  group: update-fund-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recompute the data
        run: python scripts/update.py
      - name: Save the new data
        run: |
          git config user.name "fund-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update fund data"
            git pull --rebase
            git push
          fi

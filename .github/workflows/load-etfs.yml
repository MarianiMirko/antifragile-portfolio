name: Load European ETFs
# Schedule re-registered from the GitHub website by Mirko (16 Nov 2026).
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Build the list and load full history from this date (leave empty to refresh only the latest days)"
        required: false
        default: ""
  schedule:
    - cron: "10 1 * * 6"   # every Saturday night: add the week's new prices

permissions:
  contents: read

concurrency:
  group: load-stock-prices
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-loader.txt
      - run: pip install -r requirements-loader.txt
      - name: Load ETF prices into the private database
        env:
          SUPABASE_URL: https://djrmmlsfqwowkcdxghwp.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            python scripts/load_etfs.py --since "$SINCE"
          else
            python scripts/load_etfs.py --days 15
          fi

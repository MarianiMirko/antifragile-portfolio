name: Research studies

# Runs the studies in research/ on the fund's database and saves their results in research/results/.
# Starts by hand, or when a file in research/ changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/*.py"
      - "research/*.csv"
      - "research/requirements.txt"
      - ".github/workflows/research.yml"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: S&P 500 replica study
        env:
          SUPABASE_URL: https://djrmmlsfqwowkcdxghwp.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python research/replica_study.py
      - name: IPO event study
        if: always()
        env:
          SUPABASE_URL: https://djrmmlsfqwowkcdxghwp.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python research/ipo_event_study.py
      - name: Save the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Research results"
            git pull --rebase
            git push
          fi

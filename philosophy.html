        <thead><tr><th class="l">Rule</th><th class="l">Limit</th><th class="l">Today</th></tr></thead>

    <div><div class="block-head"><h2>When we buy</h2></div><ol class="prose" id="buy"></ol></div>
    <div><div class="block-head"><h2>When we sell</h2></div><ol class="prose" id="sell"></ol></div>
  </section>

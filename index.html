<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/site.css?v=7">
<link rel="preload" href="config/fund.json" as="fetch" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<title>Overview</title>
<meta name="description" content="Live value, performance and risk rules of our student-managed fund.">
</head>
<body>
<main>
  <section class="hero wrap" aria-labelledby="hero-label">
    <p class="hero-label" id="hero-label">Market value of the fund</p>
    <p class="hero-value"><span id="nav-value">–</span><span class="hero-ccy">USD</span></p>
    <div class="hero-changes" id="hero-changes"></div>
    <p class="updated" id="updated"></p>
    <dl class="kpis" id="kpis"></dl>
  </section>

  <section class="block wrap" aria-labelledby="chart-title">
    <div class="block-head">
      <h2 id="chart-title">Fund value over time</h2>
      <div class="controls">
        <div class="seg" role="group" aria-label="Candle size">
          <button type="button" data-tf="1h" aria-pressed="true">Hourly</button>
          <button type="button" data-tf="1d" aria-pressed="false">Daily</button>
        </div>
        <div class="seg" role="group" aria-label="Candle colours">
          <button type="button" data-style="colour" aria-pressed="true">Green and red</button>
          <button type="button" data-style="mono" aria-pressed="false">Black and white</button>
        </div>
        <label class="check"><input type="checkbox" id="bench-toggle" checked><span class="swatch" aria-hidden="true"></span><span id="bench-label">Benchmark</span></label>
        <label class="check"><input type="checkbox" id="trades-toggle" checked><span>Our trades</span></label>
      </div>
    </div>
    <div class="chart-readout" id="chart-readout" aria-live="off"></div>
    <div class="chart-box" id="nav-chart" role="img" aria-label="Candlestick chart of the fund value"></div>
    <div class="trade-readout" id="trade-readout" aria-live="polite"></div>
  </section>

  <section class="block wrap">
    <div class="block-head"><h2>From the portfolio manager</h2></div>
    <div class="pm-note" id="pm-note"></div>
  </section>

  <section class="block wrap cols-2">
    <div>
      <div class="block-head"><h2>Largest holdings</h2><a href="portfolio.html">All positions</a></div>
      <ol class="bar-list" id="top-holdings"></ol>
    </div>
    <div>
      <div class="block-head"><h2>Sector exposure</h2></div>
      <ul class="bar-list" id="sectors"></ul>
      <p class="legend-note" id="sector-limit-note"></p>
    </div>
  </section>
  <section class="block wrap" id="rank-block" aria-labelledby="rank-title" hidden>
    <div class="block-head"><div><h2 id="rank-title">Where we stand in the game</h2><p id="rank-intro"></p></div></div>
    <dl class="stats" id="rank-stats" style="margin-bottom:22px"></dl>
    <ol class="rank-list" id="rank-list"></ol>
  </section>
</main>
<script defer src="assets/js/app.js?v=5"></script>
<script defer src="assets/js/overview.js?v=5"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</body>
</html>
